name: Build Kernel Redmi 13 MT6768

on:
  push:
    branches: [ lineage-22.1 ]
  pull_request:
    branches: [ lineage-22.1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libaudit-dev \
            ccache \
            git \
            wget \
            curl \
            python3 \
            python3-distutils \
            zstd \
            openssl \
            clang-14 \
            llvm-14 \
            lld-14 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu
      
      - name: Setup environment variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang-14" >> $GITHUB_ENV
          echo "LD=ld.lld-14" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy-14" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump-14" >> $GITHUB_ENV
          echo "NM=llvm-nm-14" >> $GITHUB_ENV
          echo "STRIP=llvm-strip-14" >> $GITHUB_ENV
      
      - name: Check kernel version
        run: |
          head -5 Makefile
      
      - name: Generate defconfig for MT6768
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- mt6768_defconfig || make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
      
      - name: Build kernel Image
        run: |
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-14 \
            LD=ld.lld-14 \
            -j$(nproc) Image 2>&1 | tee build.log
        continue-on-error: true
      
      - name: Build Device Tree Blob
        run: |
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-14 \
            LD=ld.lld-14 \
            -j$(nproc) dtbs 2>&1 | tee dtb_build.log
        continue-on-error: true
      
      - name: Build modules
        run: |
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-14 \
            LD=ld.lld-14 \
            -j$(nproc) modules 2>&1 | tee modules_build.log
        continue-on-error: true
      
      - name: Prepare build artifacts
        run: |
          mkdir -p build_output
          
          # Copy kernel image
          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image build_output/
            echo "✅ Kernel Image copied"
          else
            echo "⚠️ Kernel Image not found"
          fi
          
          # Copy device tree blobs
          if [ -d arch/arm64/boot/dts/mediatek ]; then
            cp arch/arm64/boot/dts/mediatek/*.dtb build_output/ 2>/dev/null || true
            echo "✅ DTB files copied"
          fi
          
          # Copy kernel modules
          find . -name "*.ko" -exec cp {} build_output/ \; 2>/dev/null || true
          
          # Copy build logs
          cp build.log build_output/ 2>/dev/null || true
          cp dtb_build.log build_output/ 2>/dev/null || true
          cp modules_build.log build_output/ 2>/dev/null || true
          
          echo "📦 Build artifacts:"
          ls -lah build_output/
      
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-redmi13-mt6768-${{ github.run_number }}
          path: build_output/
          retention-days: 30
        continue-on-error: true
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/Image
            build_output/*.dtb
            build_output/*.ko
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Build Summary
        if: always()
        run: |
          echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Device | Redmi 13 (MT6768) |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | 6.6 |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | lineage-22.1 |" >> $GITHUB_STEP_SUMMARY
          echo "| Compiler | Clang 14 |" >> $GITHUB_STEP_SUMMARY
          echo "| Arch | ARM64 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Output:" >> $GITHUB_STEP_SUMMARY
          if [ -d build_output ]; then
            ls -lh build_output/ >> $GITHUB_STEP_SUMMARY 2>&1
          else
            echo "No build output found" >> $GITHUB_STEP_SUMMARY
          fi
