name: Build Kernel Redmi 13 MT6768

on:
  push:
    branches: [ lineage-22.1 ]
  pull_request:
    branches: [ lineage-22.1 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libaudit-dev \
            ccache \
            git \
            wget \
            curl \
            python3 \
            python3-dev \
            zstd \
            openssl \
            clang-14 \
            llvm-14 \
            lld-14 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            bc \
            pahole
      
      - name: Setup environment variables
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "CC=clang-14" >> $GITHUB_ENV
          echo "LD=ld.lld-14" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy-14" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump-14" >> $GITHUB_ENV
          echo "NM=llvm-nm-14" >> $GITHUB_ENV
          echo "STRIP=llvm-strip-14" >> $GITHUB_ENV
      
      - name: Check kernel version
        run: |
          echo "=== Kernel Source Info ===" 
          head -5 Makefile
          echo ""
          echo "=== Available defconfigs ===" 
          find . -name "*defconfig" -type f | head -20
      
      - name: Generate defconfig for MT6768
        run: |
          echo "Generating defconfig for MT6768..."
          if [ -f arch/arm64/configs/defconfig ]; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- arch/arm64/configs/defconfig
          elif [ -f arch/arm64/configs/mt6768_defconfig ]; then
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- mt6768_defconfig
          else
            echo "Using generic defconfig"
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          fi
          
          echo ""
          echo "=== .config generated ===" 
          head -20 .config
      
      - name: Build kernel Image
        run: |
          echo "Starting kernel build..."
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-14 \
            LD=ld.lld-14 \
            -j$(nproc) Image 2>&1 | tee build.log
        continue-on-error: true
      
      - name: Build Device Tree Blob
        run: |
          echo "Building device tree..."
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-14 \
            LD=ld.lld-14 \
            -j$(nproc) dtbs 2>&1 | tee dtb_build.log
        continue-on-error: true
      
      - name: Build modules
        run: |
          echo "Building modules..."
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang-14 \
            LD=ld.lld-14 \
            -j$(nproc) modules 2>&1 | tee modules_build.log
        continue-on-error: true
      
      - name: Prepare build artifacts
        run: |
          mkdir -p build_output
          
          echo "=== Collecting build artifacts ===" 
          
          # Copy kernel image
          if [ -f arch/arm64/boot/Image ]; then
            cp arch/arm64/boot/Image build_output/
            echo "✅ Kernel Image: $(ls -lh build_output/Image | awk '{print $5}')"
          else
            echo "⚠️ Kernel Image not found"
          fi
          
          # Copy device tree blobs
          if [ -d arch/arm64/boot/dts ]; then
            find arch/arm64/boot/dts -name "*.dtb" -exec cp {} build_output/ \; 2>/dev/null || true
            dtb_count=$(find build_output -name "*.dtb" | wc -l)
            echo "✅ DTB files copied: $dtb_count files"
          fi
          
          # Copy kernel modules
          module_count=$(find . -name "*.ko" | wc -l)
          if [ $module_count -gt 0 ]; then
            find . -name "*.ko" -exec cp {} build_output/ \;
            echo "✅ Kernel modules copied: $module_count files"
          else
            echo "⚠️ No kernel modules found"
          fi
          
          # Copy build logs
          cp build.log build_output/ 2>/dev/null || true
          cp dtb_build.log build_output/ 2>/dev/null || true
          cp modules_build.log build_output/ 2>/dev/null || true
          cp .config build_output/kernel_config 2>/dev/null || true
          
          echo ""
          echo "=== Final build output ===" 
          ls -lh build_output/
      
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-redmi13-mt6768-${{ github.run_number }}
          path: build_output/
          retention-days: 30
        continue-on-error: true
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/Image
            build_output/*.dtb
            build_output/*.ko
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Build Summary
        if: always()
        run: |
          echo "## 📊 Build Summary - Redmi 13 MT6768" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Device | Redmi 13 (MT6768) |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | 6.6 |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | lineage-22.1 |" >> $GITHUB_STEP_SUMMARY
          echo "| Compiler | Clang 14 |" >> $GITHUB_STEP_SUMMARY
          echo "| Arch | ARM64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Date | $(date) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Output:" >> $GITHUB_STEP_SUMMARY
          if [ -d build_output ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh build_output/ >> $GITHUB_STEP_SUMMARY 2>&1
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No build output found" >> $GITHUB_STEP_SUMMARY
          fi
