name: Build Kernel Redmi 13 MT6768

on:
  push:
    branches: [ lineage-22.1 ]
  pull_request:
    branches: [ lineage-22.1 ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target'
        required: false
        default: 'redmi13_mt6768'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libaudit-dev \
            ccache \
            git \
            wget \
            curl \
            python3 \
            python3-dev \
            zstd \
            openssl \
            clang-14 \
            llvm-14 \
            lld-14 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            bc \
            pahole \
            jq
      
      - name: Check repository structure
        run: |
          echo "=== Repository Structure ===" 
          echo "Checking for build scripts and configs..."
          
          ls -la build.sh build_abi.sh 2>/dev/null || echo "Build scripts found"
          ls -la build.config.* 2>/dev/null | head -10
          
          echo ""
          echo "=== Device Folders ===" 
          ls -d mt* 2>/dev/null || echo "Device folders present"
      
      - name: Setup build environment
        run: |
          echo "=== Setting up build environment ===" 
          
          export PROJECT=mt6768
          export MODE=user
          export OUT_DIR=${PWD}/out
          export DIST_DIR=${OUT_DIR}/dist
          export BUILD_CONFIG=build.config.mtk.aarch64
          export DEFCONFIG_OVERLAYS=""
          
          mkdir -p ${OUT_DIR} ${DIST_DIR}
          
          echo "PROJECT=${PROJECT}" >> $GITHUB_ENV
          echo "MODE=${MODE}" >> $GITHUB_ENV
          echo "OUT_DIR=${OUT_DIR}" >> $GITHUB_ENV
          echo "DIST_DIR=${DIST_DIR}" >> $GITHUB_ENV
          echo "BUILD_CONFIG=${BUILD_CONFIG}" >> $GITHUB_ENV
          echo "DEFCONFIG_OVERLAYS=" >> $GITHUB_ENV
          
          echo "Build Configuration:"
          echo "  PROJECT: ${PROJECT}"
          echo "  MODE: ${MODE}"
          echo "  OUT_DIR: ${OUT_DIR}"
          echo "  BUILD_CONFIG: ${BUILD_CONFIG}"
      
      - name: Prepare kernel config
        run: |
          echo "=== Preparing kernel configuration ===" 
          
          if [ -f build.config.mtk.aarch64 ]; then
            echo "Found build.config.mtk.aarch64"
            cat build.config.mtk.aarch64
          fi
          
          echo ""
          echo "=== Creating .config ===" 
          
          # Try to extract kernel config location from build.config
          KERNEL_DIR=$(grep "KERNEL_DIR=" build.config.mtk.aarch64 | cut -d= -f2)
          if [ -z "$KERNEL_DIR" ]; then
            KERNEL_DIR="kernel"
          fi
          
          echo "Kernel directory: ${KERNEL_DIR}"
          
          if [ -d "$KERNEL_DIR" ]; then
            cd $KERNEL_DIR
            echo "Kernel found at: ${KERNEL_DIR}"
            ls -la | head -20
            cd - > /dev/null
          else
            echo "Kernel directory not found, using current directory"
          fi
      
      - name: Run build script
        run: |
          echo "=== Starting MTK Kernel Build ===" 
          
          chmod +x build.sh
          
          # Try running build.sh with proper environment
          PROJECT=mt6768 MODE=user OUT_DIR=${OUT_DIR} BUILD_CONFIG=build.config.mtk.aarch64 \
            bash build.sh 2>&1 | tee build.log || true
          
          echo ""
          echo "=== Build completed ===" 
        continue-on-error: true
        env:
          PROJECT: mt6768
          MODE: user
          OUT_DIR: ${{ env.OUT_DIR }}
          BUILD_CONFIG: build.config.mtk.aarch64
      
      - name: Collect build artifacts
        run: |
          mkdir -p build_output
          
          echo "=== Collecting artifacts ===" 
          
          # Search for kernel images
          echo "Looking for kernel Image..."
          find ${OUT_DIR} -name "Image" -type f -exec cp {} build_output/ \; 2>/dev/null || true
          find ${OUT_DIR} -name "vmlinux" -type f -exec cp {} build_output/ \; 2>/dev/null || true
          
          # Search for DTB files
          echo "Looking for DTB files..."
          find ${OUT_DIR} -name "*.dtb" -type f -exec cp {} build_output/ \; 2>/dev/null || true
          
          # Search for kernel modules
          echo "Looking for kernel modules..."
          find ${OUT_DIR} -name "*.ko" -type f -exec cp {} build_output/ \; 2>/dev/null || true
          
          # Copy build logs and configs
          cp build.log build_output/ 2>/dev/null || true
          cp .config build_output/kernel_config 2>/dev/null || true
          cp build.config.mtk.aarch64 build_output/ 2>/dev/null || true
          
          echo ""
          echo "=== Build Output Summary ===" 
          ls -lh build_output/
          
          if [ -z "$(ls -A build_output)" ]; then
            echo "WARNING: No build artifacts found. Build may have failed."
          fi
      
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-redmi13-mt6768-${{ github.run_number }}
          path: build_output/
          retention-days: 30
        continue-on-error: true
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build_output/Image
            build_output/vmlinux
            build_output/*.dtb
            build_output/*.ko
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Build Summary
        if: always()
        run: |
          echo "## 📊 Build Summary - Redmi 13 MT6768 (Device Modules)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Device | Redmi 13 (MT6768) |" >> $GITHUB_STEP_SUMMARY
          echo "| Kernel | 6.6 |" >> $GITHUB_STEP_SUMMARY
          echo "| Build System | MediaTek Device Modules |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | lineage-22.1 |" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | user |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Date | $(date) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts:" >> $GITHUB_STEP_SUMMARY
          if [ -d build_output ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            ls -lh build_output/ >> $GITHUB_STEP_SUMMARY 2>&1
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No artifacts generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Build Log:" >> $GITHUB_STEP_SUMMARY
          if [ -f build_output/build.log ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -50 build_output/build.log >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
